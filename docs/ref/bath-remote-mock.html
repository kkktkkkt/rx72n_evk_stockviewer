<!doctype html>
<html lang="ja"><head><meta charset="utf-8"><title>浴室リモコン モック(480x272、設計の基準)</title></head>
<body style="font-family:sans-serif;background:#eee">
<!-- 2026-11-21 ユーザー承認済みのデザイン(v4)。座標・色・文言は設計の基準。ブラウザで開くと5画面を操作できる。 -->
<div style="max-width:560px;margin:16px auto;background:#d9dde1;padding:16px 16px 14px;border-radius:14px">
<svg id="s" viewBox="0 0 480 272" width="100%" style="display:block;border-radius:4px;user-select:none;background:#f1f5f8"></svg>
</div>
<div id="nv" style="display:flex;flex-wrap:wrap;gap:8px;justify-content:center;margin-top:14px"></div>
<script>
(function(){
var st={scr:'home',set:42,bath:40,fill:0,flow:8.5,tick:0};
var FF="system-ui,'Hiragino Sans','Yu Gothic',sans-serif";
var INK='#374151',SUB='#7b8794',LINE='#d3dce3';
function T(x,y,s,t,c,a,w){return '<text x="'+x+'" y="'+y+'" font-size="'+s+'" fill="'+c+'" text-anchor="'+(a||'start')+'" font-weight="'+(w||400)+'" font-family="'+FF+'">'+t+'</text>';}
function R(x,y,w,h,c,r,ln){return '<rect x="'+x+'" y="'+y+'" width="'+w+'" height="'+h+'" rx="'+(r||0)+'" fill="'+c+'"'+(ln?' stroke="'+ln+'" stroke-width="1"':'')+'/>';}
function IC(n,x,y,c){var g='<g transform="translate('+x+','+y+')">';
if(n==='drop')g+='<path d="M0-13C8-3 11 2 11 6A11 11 0 0 1 -11 6C-11 2 -8-3 0-13Z" fill="'+c+'"/>';
if(n==='flame')g+='<path d="M1-14C2-8 10-4 10 4A10 10 0 0 1 -10 4C-10-1 -6-3 -5-9C-3-6 -2-5 -1-4C1-7 1-11 1-14Z" fill="'+c+'"/>';
if(n==='tub')g+='<path d="M-15-3H15V3A9 9 0 0 1 6 12H-6A9 9 0 0 1 -15 3Z" fill="'+c+'"/><path d="M-9-9Q-5-13 -1-9T7-9" stroke="'+c+'" stroke-width="2.5" fill="none" stroke-linecap="round"/>';
if(n==='power')g+='<g stroke="'+c+'" stroke-width="3" fill="none" stroke-linecap="round"><path d="M-7-8A10 10 0 1 0 7-8"/><path d="M0-13V-2"/></g>';
return g+'</g>';}
function B(x,y,w,h,label,act,bg,fg,fs,ic){fs=fs||16;var s='<g data-act="'+act+'" style="cursor:pointer">'+R(x,y,w,h,bg,10);
if(ic){s+=IC(ic,x+w/2,y+22,fg)+T(x+w/2,y+h-9,fs,label,fg,'middle',500);}else{s+=T(x+w/2,y+h/2+fs*0.36,fs,label,fg,'middle',500);}
return s+'</g>';}
function hdr(l,r){return R(0,0,480,34,'#ffffff')+R(0,34,480,1,LINE)+T(16,23,14,l,SUB)+T(464,23,14,r,SUB,'end');}
function render(){
var o=R(0,0,480,272,'#f1f5f8'),s=st;
if(s.scr==='home'){
o+=hdr('11月21日(土)','浴槽 '+s.bath+'℃ ・ 保温中');
o+=T(22,116,78,'21:45',INK,null,500);
o+=T(26,148,15,'湯はり完了 ・ 水位 標準',SUB);
o+=R(288,48,176,134,'#ffffff',12,LINE)+T(376,72,13,'設定温度',SUB,'middle')+T(366,124,56,s.set,'#3b6f93','middle',500)+T(406,124,20,'℃','#3b6f93','start',500);
o+=B(298,136,72,38,'－','dn','#dfe9f1','#3b6f93',24)+B(382,136,72,38,'＋','up','#dfe9f1','#3b6f93',24);
o+=B(16,192,106,64,'湯はり','fill','#dcebf7','#3b6f93',15,'tub')+B(130,192,106,64,'追い焚き','reheat','#fbe6d6','#b4673a',15,'flame')+B(244,192,106,64,'使用量','usage','#dcefe9','#3f8a79',15,'drop')+B(358,192,106,64,'電源','off','#e6e9ec','#5b6670',15,'power');
}else if(s.scr==='fill'){
var pct=Math.min(100,Math.round(s.fill)),done=pct>=100,min=Math.max(0,Math.ceil((100-pct)/100*8));
o+=hdr('湯はり','浴槽 '+s.bath+'℃');
o+=T(24,78,26,done?'湯はり完了':'湯はり中',INK,null,500);
o+=R(24,94,432,38,'#dde6ec',10)+R(24,94,Math.max(10,pct*4.32),38,'#8bbfe0',10)+T(240,121,22,pct+'%',INK,'middle',500);
o+=T(24,164,13,'設定水位',SUB)+T(24,188,19,'標準 200L',INK);
o+=T(180,164,13,'残り時間',SUB)+T(180,188,19,done?'－':'約'+min+'分',INK);
o+=T(336,164,13,'今の使用量',SUB)+T(336,188,19,done?'0 L/分':'12 L/分',INK);
o+=B(16,208,224,48,done?'完了':'停止','home',done?'#dcefe9':'#f7dcdc',done?'#3f8a79':'#a14a4a',18)+B(248,208,216,48,'ホーム','home','#e6e9ec','#5b6670',18);
}else if(s.scr==='reheat'){
var lo=36,p=Math.max(0,Math.min(1,(s.bath-lo)/(s.set-lo))),d=s.bath>=s.set,rm=Math.max(0,Math.ceil((s.set-s.bath)*1.5));
o+=hdr('追い焚き','設定 '+s.set+'℃');
o+=T(24,78,26,d?'追い焚き完了':'追い焚き中',INK,null,500);
o+=T(24,142,62,s.bath.toFixed(1),'#b4673a',null,500)+T(172,142,22,'℃','#b4673a',null,500);
o+=T(300,112,14,'設定温度',SUB)+T(300,150,40,s.set,INK,null,500)+T(352,150,18,'℃',INK);
o+=R(24,166,432,14,'#e8e2dc',7)+R(24,166,Math.max(10,p*432),14,'#efa979',7);
o+=T(24,204,14,d?'設定温度になりました':'あと約'+rm+'分',SUB);
o+=B(16,216,224,42,d?'完了':'停止','home',d?'#dcefe9':'#f7dcdc',d?'#3f8a79':'#a14a4a',17)+B(248,216,216,42,'ホーム','home','#e6e9ec','#5b6670',17);
}else if(s.scr==='usage'){
o+=hdr('使用量','今日の累計');
o+=T(24,68,14,'今の使用量',SUB)+T(24,122,54,s.flow.toFixed(1),'#3f8a79',null,500)+T(176,122,18,'L/分',SUB);
o+=R(250,46,102,76,'#ffffff',12,LINE)+T(301,68,13,'今日',SUB,'middle')+T(301,102,24,'124 L',INK,'middle',500);
o+=R(362,46,102,76,'#ffffff',12,LINE)+T(413,68,13,'今月',SUB,'middle')+T(413,102,24,'3,120 L',INK,'middle',500);
var v=[118,96,140,87,131,152,124],dn=['金','土','日','月','火','水','今日'];
o+=T(24,148,13,'直近7日',SUB);
for(var i=0;i<7;i++){var h=v[i]/152*54;o+=R(24+i*64,206-h,40,h,i===6?'#6fbcae':'#cfdde6',4)+T(44+i*64,224,12,dn[i],SUB,'middle');}
o+=B(380,234,84,32,'戻る','home','#e6e9ec','#5b6670',15);
}else{
o='<g data-act="home" style="cursor:pointer">'+R(0,0,480,272,'#1f262d')+T(240,150,64,'21:45','#6b7785','middle',500)+T(240,250,13,'タップで復帰','#56616d','middle')+'</g>';
}
document.getElementById('s').innerHTML=o;
}
function go(x){st.scr=x;if(x==='fill')st.fill=0;if(x==='reheat')st.bath=38;render();}
document.getElementById('s').addEventListener('click',function(e){
var g=e.target.closest('[data-act]');if(!g)return;var a=g.getAttribute('data-act');
if(a==='up')st.set=Math.min(48,st.set+1);
else if(a==='dn')st.set=Math.max(35,st.set-1);
else if(a==='home'&&st.scr==='fill'&&st.fill>=100){st.bath=40;go('home');return;}
else if(a==='home'&&st.scr==='reheat'&&st.bath>=st.set){go('home');return;}
else{go(a);return;}
render();});
var items=[['home','ホーム'],['fill','湯はり'],['reheat','追い焚き'],['usage','使用量'],['off','待機(画面オフ)']];
var nv=document.getElementById('nv');
items.forEach(function(n){var b=document.createElement('button');b.textContent=n[1];b.onclick=function(){go(n[0]);};nv.appendChild(b);});
setInterval(function(){
if(st.scr==='fill'&&st.fill<100){st.fill+=2.5;render();}
else if(st.scr==='reheat'&&st.bath<st.set){st.bath=Math.min(st.set,Math.round((st.bath+0.2)*10)/10);render();}
else if(st.scr==='usage'){st.flow=Math.round((8.5+Math.sin(st.tick++/2)*1.8)*10)/10;render();}
},800);
render();
})();
</script></body></html>
